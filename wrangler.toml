name = "applecraft-token"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
TOKEN_TTL_SECONDS = "86400"
# Origins allowed to call /token (also written into the JWT "origin" claim).
# 7532 and 7533 are the mod's fallback ports when 7531 is already in use.
ALLOWED_ORIGINS = "http://localhost:7531,http://127.0.0.1:7531,http://localhost:7532,http://localhost:7533"

# Secrets (set them with wrangler, never in this file):
#   npx wrangler secret put APPLE_PRIVATE_KEY   < AuthKey_XXXXXXXXXX.p8
#   npx wrangler secret put APPLE_TEAM_ID
#   npx wrangler secret put APPLE_KEY_ID
